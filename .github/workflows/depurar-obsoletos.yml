name: Depurar archivos obsoletos

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "AUDITAR reporta; ELIMINAR retira solo recursos huérfanos comprobados"
        required: true
        type: choice
        options:
          - AUDITAR
          - ELIMINAR
        default: AUDITAR
      confirmacion:
        description: "Para eliminar escribe: DEPURAR_LAYOUT"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: depurar-layout-main
  cancel-in-progress: false

jobs:
  depurar:
    name: Auditar y depurar con evidencia
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar confirmación
        if: inputs.accion == 'ELIMINAR' && inputs.confirmacion != 'DEPURAR_LAYOUT'
        run: |
          echo "Confirmación inválida. No se eliminó ningún archivo."
          exit 1

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar sin modificar
        if: inputs.accion == 'AUDITAR'
        run: python tools/audit_project.py --report "${RUNNER_TEMP}/depuracion.json"

      - name: Eliminar solo residuos comprobados
        if: inputs.accion == 'ELIMINAR'
        run: python tools/audit_project.py --prune --report "${RUNNER_TEMP}/depuracion.json"

      - name: Mostrar alcance exacto
        if: inputs.accion == 'ELIMINAR'
        run: |
          git status --short
          echo "Solo se registrarán recursos huérfanos declarados por la auditoría y residuos temporales permitidos."

      - name: Validar después de la limpieza
        if: inputs.accion == 'ELIMINAR'
        run: |
          node --check app.js
          node --check sw.js
          python tools/audit_project.py

      - name: Registrar cambios
        if: inputs.accion == 'ELIMINAR'
        run: |
          python - <<'PY' > "${RUNNER_TEMP}/rutas-eliminadas.txt"
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "depuracion.json").read_text(encoding="utf-8"))
          for path in report.get("removed", []):
              if path.endswith("/"):
                  continue
              print(path)
          PY
          while IFS= read -r path; do
            [ -n "$path" ] && git add -- "$path"
          done < "${RUNNER_TEMP}/rutas-eliminadas.txt"
          if git diff --cached --quiet; then
            echo "No existen archivos obsoletos por eliminar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: retirar archivos obsoletos auditados"
          git push

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depuracion-layout-${{ github.run_number }}
          path: ${{ runner.temp }}/depuracion.json
          if-no-files-found: warn
          retention-days: 14
